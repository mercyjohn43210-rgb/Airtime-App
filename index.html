<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Johnmercy Data & Airtime</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">JM</div>
    <div>
      <b>Johnmercy</b>
      <small>Data & Airtime</small>
    </div>
  </div>

  <button id="logout" class="danger hidden">Log out</button>
</header>

<main>

<section id="auth" class="screen">
  <div class="card auth">

    <h1 id="authTitle">Welcome back</h1>

    <p>Buy airtime and data from one simple dashboard.</p>

    <input
      id="name"
      class="hidden"
      placeholder="Full name"
    >

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="authBtn" class="primary">
      Log in
    </button>

    <button id="switch" class="link">
      Create an account
    </button>

  </div>
</section>

<section id="app" class="hidden">

  <div class="card wallet">

    <div>
      <span>Wallet balance</span>
      <strong id="balance">₦0.00</strong>
    </div>

    <button id="fund" class="secondary">
      Add Money
    </button>

  </div>

  <nav>
    <button class="tab active" data-page="home">Home</button>
    <button class="tab" data-page="airtime">Airtime</button>
    <button class="tab" data-page="data">Data</button>
    <button class="tab" data-page="wallet">Wallet</button>
    <button class="tab" data-page="history">History</button>
  </nav>

  <section id="home" class="page">

    <div class="card hero">
      <h2>Welcome to Johnmercy</h2>
      <p>Fast and easy airtime & data purchases.</p>
    </div>

    <div class="grid">

      <button class="service" data-go="airtime">
        📱
        <b>Buy Airtime</b>
        <small>MTN, Airtel, Glo & 9mobile</small>
      </button>

      <button class="service" data-go="data">
        🌐
        <b>Buy Data</b>
        <small>Choose your data bundle</small>
      </button>

    </div>

  </section>

  <section id="airtime" class="page hidden">

    <div class="card">

      <h2>Buy Airtime</h2>

      <select id="aNetwork">
        <option>MTN</option>
        <option>Airtel</option>
        <option>Glo</option>
        <option>9mobile</option>
      </select>

      <input
        id="aPhone"
        inputmode="numeric"
        placeholder="Phone number"
      >

      <input
        id="aAmount"
        inputmode="decimal"
        placeholder="Amount (₦)"
      >

      <button id="buyAirtime" class="primary">
        Buy Airtime
      </button>

    </div>

  </section>

  <section id="data" class="page hidden">

    <div class="card">

      <h2>Buy Data</h2>

      <select id="dNetwork">
        <option>MTN</option>
        <option>Airtel</option>
        <option>Glo</option>
        <option>9mobile</option>
      </select>

      <input
        id="dPhone"
        inputmode="numeric"
        placeholder="Phone number"
      >

      <select id="dPlan">
        <option value="500">1GB — ₦500</option>
        <option value="1000">2.5GB — ₦1,000</option>
        <option value="1500">5GB — ₦1,500</option>
        <option value="2500">10GB — ₦2,500</option>
      </select>

      <button id="buyData" class="primary">
        Buy Data
      </button>

    </div>

  </section>

  <section id="wallet" class="page hidden">

    <div class="card">

      <h2>Wallet</h2>

      <p>Your current wallet balance:</p>

      <strong id="walletBalance">₦0.00</strong>

      <br>
      <br>

      <input
        id="fundAmount"
        type="number"
        min="100"
        step="1"
        inputmode="decimal"
        placeholder="Enter amount (₦)"
      >

      <button id="fund2" class="secondary">
        Add Money
      </button>

    </div>

  </section>

  <section id="history" class="page hidden">

    <div class="card">

      <h2>Transaction history</h2>

      <div id="transactions">
        <p class="muted">No transactions yet.</p>
      </div>

    </div>

  </section>

</section>

</main>

<div id="toast"></div>

<script src="app.js"></script>

</body>
</html>
